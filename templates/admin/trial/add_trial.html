<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Quicksand:wght@300..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Lexend -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <title>Add Trial</title>
    <style>
        body {
            overflow-x: hidden;
        }
    </style>
</head>

<body style="font-family: Quicksand;">

    <!-- TOP NAVBAR -->
    {% include 'admin/components/top_navbar.html' %}

    <div class="d-flex">

        <!-- SIDEBAR -->
        {% include 'admin/components/sidebar.html' %}

        <!-- MAIN CONTENT -->
        <div class="flex-grow-1 p-4" style="background-color: #f4f6f9;">

            <div class="d-flex justify-content-center align-items-center">
                <form action="" method="POST" class="bg-white p-4 shadow" style="border-radius: 10px; width: 450px;">
                    <h3 class="mb-4 fw-bold">Add Trial</h3>
                    <!-- Name -->
                    <div class="form-group mb-3">
                        <label style="font-weight: 500; font-size: 15px;" class="mb-1">Trial Student Name</label>
                        <input type="text" name="form_name" class="form-control"
                            placeholder="Enter the trial student name" required autocomplete="off"
                            style="width: 100%; height: 33px; border-radius: 8px; font-size: 14px;">
                    </div>
                    <!-- DOB & AGE -->
                    <div class="row mb-3">
                        <div class="col-6 form-group">
                            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Date of Birth</label>
                            <input type="date" id="dob" name="form_dob" class="form-control" required autocomplete="off"
                                style="width: 100%; height: 33px; border-radius: 8px; font-size: 14px;">
                        </div>
                        <div class="col-6 form-group">
                            <label style="font-weight: 500; font-size: 15px;" class="mb-1">
                                Age
                            </label>

                            <input type="text" id="age" name="form_age" class="form-control" readonly
                                placeholder="Auto calculated"
                                style="width: 100%; height: 33px; border-radius: 8px; font-size: 14px;">
                        </div>
                    </div>

                    <!-- Parent Name -->
                    <div class="form-group mb-3">
                        <label style="font-weight: 500; font-size: 15px;" class="mb-1">Parent Name</label>
                        <input type="text" name="form_parent_name" class="form-control"
                            placeholder="Enter the parent's name" required autocomplete="off"
                            style="width: 100%; height: 33px; border-radius: 8px; font-size: 14px;">
                    </div>

                    <!-- Parent Telp -->
                    <div class="form-group mb-3">
                        <label style="font-weight: 500; font-size: 15px;" class="mb-1">Phone Number</label>
                        <input type="tel" name="form_parent_telp" class="form-control"
                            placeholder="Enter the parent's phone number" required autocomplete="off"
                            style="width: 100%; height: 33px; border-radius: 8px; font-size: 14px;">
                    </div>

                    <!-- Trial Date -->
                    <div class="form-group mb-3">
                        <label style="font-weight: 500; font-size: 15px;" class="mb-1">Trial Date</label>
                        <input type="date" name="form_trial_date" class="form-control"
                            placeholder="Enter the trial date" required autocomplete="off"
                            style="width: 100%; height: 33px; border-radius: 8px; font-size: 14px;">
                    </div>

                    <div>
                        <input type="submit" value="ADD TRIAL STUDENT" class="btn btn-sm w-100 fw-bold"
                            style="border-radius: 5px; background-color: #ff682d; color: white;">
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.getElementById("dob").addEventListener("change", function () {

            const dobValue = this.value;

            if (!dobValue) {
                document.getElementById("age").value = "";
                return;
            }

            const dob = new Date(dobValue);
            const today = new Date();

            let years = today.getFullYear() - dob.getFullYear();
            let months = today.getMonth() - dob.getMonth();

            if (today.getDate() < dob.getDate()) {
                months--;
            }

            if (months < 0) {
                years--;
                months += 12;
            }

            document.getElementById("age").value =
                years + "." + String(months).padStart(2, "0");
        });
    </script>
</body>

</html>
