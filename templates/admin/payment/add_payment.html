<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Quicksand:wght@300..700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Lexend -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
  <title>Add Payment</title>
  <style>
    body {
      overflow-x: hidden;
    }

    #paymentSummaryBox {
      font-size: 13px;
      line-height: 1.4;
    }
  </style>
</head>

<body style="font-family: Quicksand;">

  <!-- TOP NAVBAR -->
  {% include 'admin/components/top_navbar.html' %}

  <div class="d-flex">

    <!-- SIDEBAR -->
    {% include 'admin/components/sidebar.html' %}

    <!-- MAIN CONTENT -->
    <div class="flex-grow-1 p-4" style="background-color: #f4f6f9;">
      <div class="d-flex justify-content-center align-items-center">
        <form action="" method="POST" class="bg-white p-4 shadow needs-validation" id="paymentForm"
          style="border-radius: 10px; width: 450px;">
          <h3 class="mb-4 fw-bold">Add Payment</h3>

          <!-- Year -->
          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Year</label>
            <select id="yearSelect" name="form_year" class="form-select"
              style="width: 100%; height: 33px; border-radius: 8px; font-size: 14px;"></select>
          </div>

          <!-- Term -->
          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Term (can select multiple)</label><br>
            <input type="checkbox" name="form_term" value="1"> <span style="font-size: 15px;">Term 1</span><br>
            <input type="checkbox" name="form_term" value="2"> <span style="font-size: 15px;">Term 2</span><br>
            <input type="checkbox" name="form_term" value="3"> <span style="font-size: 15px;">Term 3</span><br>
            <input type="checkbox" name="form_term" value="4"> <span style="font-size: 15px;">Term 4</span><br>
          </div>

          <!-- Student -->
          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Student</label>
            <select name="form_id_student" class="form-select" required
              style="width: 100%; height: 33px; border-radius: 8px; font-size: 14px;">
              <option value="" disabled selected>Select Student</option>
              {% for student in data_student %}
              <option value="{{student[0]}}">{{student[1]}}</option>
              {% endfor %}
            </select>
          </div>

          <!-- Tuition Fee -->
          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Tuition Fee</label>
            <input type="text" id="tuitionFee" name="form_tuition_fee" class="form-control" required
              style="width: 100%; height: 33px; border-radius: 8px; font-size: 14px;">
          </div>

          <!-- Registration Fee -->
          <div class="mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Registration Fee</label>
            <select id="regFee" name="form_registration_fee" class="form-select"
              style="width: 100%; height: 33px; border-radius: 8px; font-size: 14px;">
              <option value="no">No</option>
              <option value="yes">Yes</option>
              <option value="free">Free</option>
              <option value="already_paid">Already Paid</option>
            </select>
          </div>

          <!-- REGISTRATION AMOUNT (HIDDEN BY DEFAULT) -->
          <div class="mb-3" id="regFeeAmountContainer" style="display:none;">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Registration Amount</label>
            <input type="text" id="regFeeAmount" name="form_registration_amount" class="form-control"
              placeholder="Enter amount" style="width: 100%; height: 33px; border-radius: 8px; font-size: 14px;">
          </div>

          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Discount Type</label>
            <select name="form_discount_type" class="form-select"
              style="width: 100%; height: 33px; border-radius: 8px; font-size: 14px;">
              <option value="">None</option>
              <option value="pro-rate">Pro Rate</option>
              <option value="sibling">Sibling</option>
              <option value="bring-friend">Bring Friend</option>
            </select>
          </div>


          <!-- Payment Method -->
          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Payment Method</label>
            <select name="form_payment_method" class="form-select"
              style="width: 100%; height: 33px; border-radius: 8px; font-size: 14px;">
              <option value="cash" selected>Cash</option>
              <option value="transfer">Transfer</option>
              <option value="credit/debit card">Credit/Debit Card</option>
            </select>
          </div>

          <!-- Payment Date -->
          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Payment Date</label>
            <input type="date" name="form_payment_date" class="form-control" required autocomplete="off"
              style="width: 100%; height: 33px; border-radius: 8px; font-size: 14px;">
          </div>

          <!-- Total Payment -->
          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1 fw-bold">Total Payment</label>
            <input type="text" id="totalPayment" name="form_total_payment" class="form-control"
              style="width: 100%; height: 33px; border-radius: 8px; font-size: 14px; background-color: #f1f1f1;">
          </div>

          <div>
            <input type="submit" value="ADD PAYMENT" class="btn btn-sm w-100 fw-bold"
              style="border-radius: 5px; background-color: #ff682d; color: white;">
          </div>
        </form>
      </div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const toggleBtn = document.getElementById("toggle-btn");
    const sidebar = document.getElementById("sidebar");

    toggleBtn.addEventListener("click", () => {
      sidebar.classList.toggle("collapsed");
    });
  </script>

  <script>
    const studentSelect = document.querySelector("select[name='form_id_student']");

    studentSelect.addEventListener("change", function () {
      const studentId = this.value;

      fetch(`/check_registration_status?id_student=${studentId}`)
        .then(res => res.json())
        .then(data => {
          if (data.already_paid) {
  // 🔴 ONLY SHOW "Already Paid"
  regFee.innerHTML = `<option value="already_paid" selected>Already Paid</option>`;
  regFeeContainer.style.display = "none";
} else {
  // 🟢 NORMAL OPTIONS
  regFee.innerHTML = `
    <option value="no">No</option>
    <option value="yes">Yes</option>
    <option value="free">Free</option>
  `;
  regFee.value = "no";
}
calculateTotal();

          calculateTotal();
        });
    });
    // ================= YEAR DYNAMIC =================
    const yearSelect = document.getElementById("yearSelect");

    let currentYear = new Date().getFullYear();

    function renderYears(centerYear) {
      yearSelect.innerHTML = "";

      const years = [centerYear - 1, centerYear, centerYear + 1];

      years.forEach(year => {
        const option = document.createElement("option");
        option.value = year;
        option.textContent = year;

        if (year === centerYear) option.selected = true;

        yearSelect.appendChild(option);
      });
    }

    // INIT
    renderYears(currentYear);

    // SHIFT WINDOW
    yearSelect.addEventListener("change", function () {
      renderYears(parseInt(this.value));
    });


    // ================= ELEMENTS =================
    const tuitionFee = document.getElementById("tuitionFee");
    const regFee = document.getElementById("regFee");
    const regFeeAmount = document.getElementById("regFeeAmount");
    const regFeeContainer = document.getElementById("regFeeAmountContainer");

    const discountType = document.querySelector("select[name='form_discount_type']");
    const discountInputContainer = document.createElement("div");
    discountInputContainer.classList.add("mb-3");
    discountInputContainer.style.display = "none";

    discountInputContainer.innerHTML = `
  <label style="font-weight: 500; font-size: 15px;" class="mb-1">Discount Amount</label>
  <input type="text" id="discountFee" name="form_discount_fee" class="form-control" value="0"
    style="width: 100%; height: 33px; border-radius: 8px; font-size: 14px;">
`;

    discountType.parentNode.after(discountInputContainer);

    const totalPayment = document.getElementById("totalPayment");

    // CREATE SUMMARY BOX
    const summaryBox = document.createElement("div");
    summaryBox.id = "paymentSummaryBox";
    summaryBox.classList.add("mb-3", "p-3", "bg-light", "rounded");
    summaryBox.innerHTML = "<b>Payment Summary</b><br>";
    totalPayment.parentNode.before(summaryBox);


    // ================= REGISTRATION LOGIC =================
    regFee.addEventListener("change", function () {
      if (this.value === "yes") {
        regFeeContainer.style.display = "block";
      } else {
        regFeeContainer.style.display = "none";
        regFeeAmount.value = 0;
      }
      calculateTotal();
    });


    // ================= DISCOUNT LOGIC =================
    discountType.addEventListener("change", function () {
      if (this.value !== "") {
        discountInputContainer.style.display = "block";
      } else {
        discountInputContainer.style.display = "none";
        document.getElementById("discountFee").value = 0;
      }
      calculateTotal();
    });

    // ================= FORMAT =================
    function formatRupiah(num) {
      let number_string = num.toString().replace(/[^,\d]/g, '');
      let split = number_string.split(',');
      let sisa = split[0].length % 3;
      let rupiah = split[0].substr(0, sisa);
      let ribuan = split[0].substr(sisa).match(/\d{3}/gi);

      if (ribuan) {
        let separator = sisa ? ',' : '';
        rupiah += separator + ribuan.join(',');
      }

      return rupiah ? 'Rp ' + rupiah : '';
    }

    function getNumber(value) {
      return parseInt(value.replace(/[^0-9]/g, '')) || 0;
    }
    // ================= CALCULATION =================
    function calculateTotal() {
      let tuition = getNumber(tuitionFee.value);
      let reg = 0;
      let discount = 0;

      const discountField = document.getElementById("discountFee");
      if (discountField) {
        discount = getNumber(discountField.value || "0");
      }

      let total = tuition;

      if (regFee.value === "yes") {
        reg = getNumber(regFeeAmount.value);
        total += reg;
      }

      total -= discount;
      if (total < 0) total = 0;

      totalPayment.value = "Rp " + total.toLocaleString("id-ID");

      // ✅ DEFINE FIRST
      let summaryHTML = "<b>Payment Summary</b><br>";
      summaryHTML += "Tuition: Rp " + tuition.toLocaleString("id-ID") + "<br>";

      if (regFee.value === "yes") {
        summaryHTML += "Registration: Rp " + reg.toLocaleString("id-ID") + "<br>";
      } else if (regFee.value === "free") {
        summaryHTML += "Registration: FREE<br>";
      } else if (regFee.value === "already_paid") {
        summaryHTML += "Registration: ALREADY PAID<br>";
      }

      if (discountType.value !== "") {
        summaryHTML += "Discount (" + discountType.value + "): -Rp " + discount.toLocaleString("id-ID") + "<br>";
      }

      summaryHTML += "<hr><b>Total: Rp " + total.toLocaleString("id-ID") + "</b>";

      summaryBox.innerHTML = summaryHTML;
    }
    // ================= EVENTS =================
    tuitionFee.addEventListener("input", calculateTotal);
    regFeeAmount.addEventListener("input", calculateTotal);
    document.addEventListener("input", function (e) {
      if (e.target.id === "discountFee") calculateTotal();
    });

    // ================= LIVE FORMAT =================
    [tuitionFee, regFeeAmount].forEach(input => {
      input.addEventListener("input", function () {
        let number = getNumber(this.value);
        this.value = formatRupiah(number);
        calculateTotal();
      });
    });

    document.addEventListener("input", function (e) {
      if (e.target.id === "discountFee") {
        let number = getNumber(e.target.value);
        e.target.value = formatRupiah(number);
        calculateTotal();
      }
    });
  </script>

</body>

</html>
