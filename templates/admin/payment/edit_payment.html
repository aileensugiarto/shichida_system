<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Quicksand:wght@300..700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Lexend -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
  <title>Edit Payment</title>
  <style>
    body {
      overflow-x: hidden;
    }
  </style>
</head>

<body style="font-family: Quicksand;">

  <!-- TOP NAVBAR -->
  {% include 'admin/components/top_navbar.html' %}

  <div class="d-flex">

    <!-- SIDEBAR -->
    {% include 'admin/components/sidebar.html' %}

    <!-- MAIN CONTENT -->
    <div class="flex-grow-1 p-4" style="background-color: #f4f6f9;">
      <div class="d-flex justify-content-center align-items-center">
        <form action="/process_edit_payment" method="POST" class="bg-white p-4 shadow needs-validation" id="paymentForm"
          style="border-radius: 10px; width: 450px;">
          <h3 class="mb-4 fw-bold">Edit Payment</h3>
          <input type="hidden" name="form_id_payment" value="{{ data_payment[0] }}">

          <!-- Year -->
          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Year</label>
            <select id="yearSelect" name="form_year" class="form-select" value="{{data_payment[4]}}"
              style="width: 100%; height: 33px; border-radius: 8px; font-size: 14px;"></select>
          </div>

          <!-- Term -->
          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Term (can select multiple)</label><br>
            {% set selected_terms = data_payment[3].split(',') %}

            <input type="checkbox" name="form_term" value="1" {% if '1' in selected_terms %}checked{% endif %}>
            Term 1<br>

            <input type="checkbox" name="form_term" value="2" {% if '2' in selected_terms %}checked{% endif %}>
            Term 2<br>

            <input type="checkbox" name="form_term" value="3" {% if '3' in selected_terms %}checked{% endif %}>
            Term 3<br>

            <input type="checkbox" name="form_term" value="4" {% if '4' in selected_terms %}checked{% endif %}>
            Term 4<br>
          </div>

          <!-- Student -->
          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Student</label>
            <select name="form_id_student" class="form-select" required
              style="width: 100%; height: 33px; border-radius: 8px; font-size: 14px;">
              <option value="{{data_payment[1]}}">{{data_payment[2]}}</option>
            </select>
          </div>

          <!-- Tuition Fee -->
          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Tuition Fee</label>
            <input type="text" id="tuitionFee" name="form_tuition_fee" class="form-control" required
              value="{{data_payment[10]}}" style="width: 100%; height: 33px; border-radius: 8px; font-size: 14px;">
          </div>

          <!-- Registration Fee -->
          <div class="mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Registration Fee</label>
            <select id="regFee" name="form_registration_fee" class="form-select"
                    style="width: 100%; height: 33px; border-radius: 8px; font-size: 14px;">
              {% if data_payment[5] == 'already_paid' %}
                <!-- Only show Already Paid -->
                <option value="already_paid" selected>Already Paid</option>
              {% else %}
                <!-- Show all normal options -->
                <option value="no" {% if data_payment[5]=='no' %}selected{% endif %}>No</option>
                <option value="yes" {% if data_payment[5]=='yes' %}selected{% endif %}>Yes</option>
                <option value="free" {% if data_payment[5]=='free' %}selected{% endif %}>Free</option>
              {% endif %}
            </select>
          </div>

          <!-- Registration Fee -->
          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Discount</label>
            <select name="form_discount_type" class="form-select"
              style="width: 100%; height: 33px; border-radius: 8px; font-size: 14px;">
              <option value="">None</option>
              <option value="pro-rate" {% if data_payment[6]=='pro-rate' %}selected{% endif %}>
                Pro Rate
              </option>
              <option value="sibling" {% if data_payment[6]=='sibling' %}selected{% endif %}>
                Sibling
              </option>
              <option value="bring-friend" {% if data_payment[6]=='bring-friend' %}selected{% endif %}>
                Bring Friend
              </option>
            </select>
          </div>

          <!-- Payment Method -->
          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Payment Method</label>
            <select name="form_payment_method" class="form-select"
              style="width: 100%; height: 33px; border-radius: 8px; font-size: 14px;">
              <option value="cash" {% if data_payment[8] == 'cash' %}selected{% endif %}>Cash</option>
              <option value="transfer" {% if data_payment[8] == 'transfer' %}selected{% endif %}>Transfer</option>
              <option value="credit/debit card" {% if data_payment[8] == 'credit/debit card' %}selected{% endif %}>
                Credit/Debit Card</option>
            </select>
          </div>


          <!-- Payment Date -->
          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Payment Date</label>
            <input type="date" name="form_payment_date" class="form-control" autocomplete="off"
              value="{{ data_payment[9] }}" style="width: 100%; height: 33px; border-radius: 8px; font-size: 14px;">
          </div>

          <!-- Payment Summary -->
          <div class="form-group mb-3">
            <div id="paymentSummary" style="font-size:13px;background:#f8f9fa;padding:10px;border-radius:8px;">
            </div>
          </div>

          <!-- Total Payment -->
          <div class="form-group mb-4">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1 fw-bold">Total Payment</label>
            <input type="text" id="totalPayment" name="form_total_payment" class="form-control"
              style="width: 100%; height: 33px; border-radius: 8px; font-size: 14px; background-color: #f1f1f1;">
          </div>

          <div>
            <input type="submit" value="EDIT PAYMENT" class="btn btn-sm w-100 fw-bold"
              style="border-radius: 5px; background-color: #ffd555;">
          </div>
        </form>
      </div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const toggleBtn = document.getElementById("toggle-btn");
    const sidebar = document.getElementById("sidebar");

    toggleBtn.addEventListener("click", () => {
      sidebar.classList.toggle("collapsed");
    });
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      // ================= HELPERS =================
      function formatRupiah(angka) {
        let number_string = angka.toString().replace(/[^,\d]/g, '');
        let split = number_string.split(',');
        let sisa = split[0].length % 3;
        let rupiah = split[0].substr(0, sisa);
        let ribuan = split[0].substr(sisa).match(/\d{3}/gi);

        if (ribuan) {
          let separator = sisa ? ',' : '';
          rupiah += separator + ribuan.join(',');
        }

        return rupiah ? 'Rp ' + rupiah : '';
      }

      function getNumber(value) {
        return parseInt(value.replace(/[^0-9]/g, '')) || 0;
      }

      // ================= YEAR =================
      const yearSelect = document.getElementById("yearSelect");
      let selectedYear = {{data_payment[4]}};

      function renderYears(centerYear) {
        yearSelect.innerHTML = "";
        const years = [centerYear - 1, centerYear, centerYear + 1];

        years.forEach(year => {
          const option = document.createElement("option");
          option.value = year;
          option.textContent = year;

          if (year === selectedYear) option.selected = true;

          yearSelect.appendChild(option);
        });
      }

      renderYears(selectedYear);

      yearSelect.addEventListener("change", function () {
        selectedYear = parseInt(this.value);
        renderYears(selectedYear);
      });

      // ================= ELEMENTS =================
      const tuitionFee = document.getElementById("tuitionFee");
      const regFee = document.getElementById("regFee");
      const discountType = document.querySelector("select[name='form_discount_type']");
      const totalPayment = document.getElementById("totalPayment");
      const summaryBox = document.getElementById("paymentSummary");

      // ================= CREATE FIELDS =================
      const regFeeContainer = document.createElement("div");
      regFeeContainer.classList.add("mb-3");
      regFeeContainer.innerHTML = `
    <label class="mb-1" style="font-weight:500;font-size:15px;">Registration Amount</label>
    <input type="text" id="regFeeAmount" name="form_registration_amount" class="form-control"
      value="{{ data_payment[11] or 0 }}" style="width: 100%; height: 33px; border-radius: 8px; font-size: 14px;">
  `;
      regFee.parentNode.after(regFeeContainer);

      const discountContainer = document.createElement("div");
      discountContainer.classList.add("mb-3");
      discountContainer.innerHTML = `
    <label class="mb-1" style="font-weight:500;font-size:15px;">Discount Amount</label>
    <input type="text" id="discountFee" name="form_discount_fee" class="form-control"
      value="{{ data_payment[7] or 0 }}" style="width: 100%; height: 33px; border-radius: 8px; font-size: 14px;">
  `;
      discountType.parentNode.after(discountContainer);

      const regFeeAmount = document.getElementById("regFeeAmount");
      const discountFee = document.getElementById("discountFee");

      // ================= LOCK LOGIC =================
      function handleRegFeeLock() {
        if (regFee.value === "already_paid") {
          // regFee.disabled = true;
          regFeeContainer.style.display = "none";
        } else {
          regFee.disabled = false;

          if (regFee.value === "yes") {
            regFeeContainer.style.display = "block";
          } else {
            regFeeContainer.style.display = "none";
            regFeeAmount.value = "Rp 0";
          }
        }
      }

      // ================= INIT =================
      function initFields() {
        handleRegFeeLock();

        if (discountType.value === "") {
          discountContainer.style.display = "none";
        }

        tuitionFee.value = formatRupiah(tuitionFee.value);
        regFeeAmount.value = formatRupiah(regFeeAmount.value);
        discountFee.value = formatRupiah(discountFee.value);
      }

      initFields();

      // ================= EVENTS =================
      regFee.addEventListener("change", function () {
        handleRegFeeLock();
        calculateTotal();
      });

      discountType.addEventListener("change", function () {
        if (this.value !== "") {
          discountContainer.style.display = "block";
        } else {
          discountContainer.style.display = "none";
          discountFee.value = "Rp 0";
        }
        calculateTotal();
      });

      // ================= FORMAT INPUT =================
      [tuitionFee, regFeeAmount, discountFee].forEach(input => {
        input.addEventListener("input", function () {
          let number = getNumber(this.value);
          this.value = formatRupiah(number);
          calculateTotal();
        });
      });

      // ================= CALCULATION =================
      function calculateTotal() {
        let tuition = getNumber(tuitionFee.value);
        let reg = 0;
        let discount = 0;

        if (regFee.value === "yes") {
          reg = getNumber(regFeeAmount.value);
        }

        if (discountType.value !== "") {
          discount = getNumber(discountFee.value);
        }

        let total = tuition + reg - discount;
        if (total < 0) total = 0;

        totalPayment.value = formatRupiah(total);

        // ===== SUMMARY =====
        let html = "<b>Payment Summary</b><br>";
        html += "Tuition: " + formatRupiah(tuition) + "<br>";

        if (regFee.value === "yes") {
          html += "Registration: " + formatRupiah(reg) + "<br>";
        } else if (regFee.value === "free") {
          html += "Registration: FREE<br>";
        } else if (regFee.value === "already_paid") {
          html += "Registration: ALREADY PAID<br>";
        }

        if (discountType.value !== "") {
          html += "Discount (" + discountType.value + "): -" + formatRupiah(discount) + "<br>";
        }

        html += "<hr><b>Total: " + formatRupiah(total) + "</b>";

        summaryBox.innerHTML = html;
      }

      calculateTotal();
    });
  </script>
</body>

</html>
