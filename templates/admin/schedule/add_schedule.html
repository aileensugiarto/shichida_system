<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Quicksand:wght@300..700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <!-- Lexend -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
  <title>Add Schedule</title>
  <style>
    body {
      overflow-x: hidden;
    }
  </style>
</head>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const termSelect = document.getElementById("termSelect");

    const studentGroup = document.getElementById("termStudentGroup");

    const trialStudentGroup = document.getElementById("trialStudentGroup");
    const trialDobGroup = document.getElementById("trialDobGroup");
    const trialAgeGroup = document.getElementById("trialAgeGroup");
    const trialParentNameGroup = document.getElementById("trialParentNameGroup");
    const trialParentTelpGroup = document.getElementById("trialParentTelpGroup");

    const totalMeetings = document.getElementById("totalMeetings");

    function toggleTrialFields() {

        if (termSelect.value === "TRIAL") {

            studentGroup.classList.add("d-none");

            trialStudentGroup.classList.remove("d-none");
            trialDobGroup.classList.remove("d-none");
            trialAgeGroup.classList.remove("d-none");
            trialParentNameGroup.classList.remove("d-none");
            trialParentTelpGroup.classList.remove("d-none");

            totalMeetings.value = 1;
            totalMeetings.readOnly = true;

        } else {

            studentGroup.classList.remove("d-none");

            trialStudentGroup.classList.add("d-none");
            trialDobGroup.classList.add("d-none");
            trialAgeGroup.classList.add("d-none");
            trialParentNameGroup.classList.add("d-none");
            trialParentTelpGroup.classList.add("d-none");

            totalMeetings.readOnly = false;
        }
    }

    termSelect.addEventListener("change", toggleTrialFields);

    toggleTrialFields();
});
</script>

<body style="font-family: Quicksand;">

  <!-- TOP NAVBAR -->
  {% include 'admin/components/top_navbar.html' %}

  <div class="d-flex">

    <!-- SIDEBAR -->
    {% include 'admin/components/sidebar.html' %}

    <!-- MAIN CONTENT -->
    <div class="flex-grow-1 p-4" style="background-color: #f4f6f9;">
      <div class="d-flex justify-content-center align-items-center">
        <form action="" method="POST" class="bg-white p-4 shadow needs-validation"
          style="border-radius: 10px; width: 500px;">

          <h3 class="mb-4 fw-bold">Add Schedule</h3>

          <!-- Term -->
          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Term</label>
            <select name="form_term" id="termSelect" class="form-select" required
              style="height: 33px; border-radius: 8px; font-size: 14px;">
              <option value="" selected disabled>Select Term</option>
              <option value="1">Term 1</option>
              <option value="2">Term 2</option>
              <option value="3">Term 3</option>
              <option value="4">Term 4</option>
              <option value="TRIAL">Trial</option>
            </select>
          </div>

          <!-- Student -->
          <div class="form-group mb-3" id="termStudentGroup">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Student</label>
            <select name="form_student" class="form-select" required
              style="height: 33px; border-radius: 8px; font-size: 14px;">
              <option disabled selected>Select a student</option>
              {% for student in data_student %}
              <option value="{{ student[0] }}">{{ student[1] }} ({{ student[2] }})</option>
              {% endfor %}
            </select>
          </div>

          <!-- Trial Student Name -->
          <div class="form-group mb-3 d-none" id="trialStudentGroup">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Trial Student Name</label>
            <input type="text" name="form_trial_student_name" class="form-control" placeholder="Enter student name"
              style="height: 33px; border-radius: 8px; font-size: 14px;">
          </div>

          <!-- Trial DOB -->

          <div class="row">
            <div class="col-6">
              <div class="form-group mb-3 d-none" id="trialDobGroup">
                <label style="font-weight: 500; font-size: 15px;" class="mb-1">Date of Birth</label>
                <input type="date" id="trialDob" name="form_trial_dob" class="form-control"
                  style="height: 33px; border-radius: 8px; font-size: 14px;">
              </div>
            </div>
            <div class="col-6">
              <div class="form-group mb-3 d-none" id="trialAgeGroup">
                <label style="font-weight: 500; font-size: 15px;" class="mb-1">Age</label>
                <input type="text" id="trialAge" class="form-control" readonly
                  style="height: 33px; border-radius: 8px; font-size: 14px;">
              </div>
            </div>
          </div>

          <!-- Trial Parent Name -->
          <div class="form-group mb-3 d-none" id="trialParentNameGroup">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Parent Name</label>
            <input type="text" name="form_trial_parent_name" class="form-control" placeholder="Enter parent name"
              style="height: 33px; border-radius: 8px; font-size: 14px;">
          </div>

          <!-- Trial Parent Telp -->
          <div class="form-group mb-3 d-none" id="trialParentTelpGroup">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Parent Phone</label>
            <input type="text" name="form_trial_parent_telp" class="form-control" placeholder="Enter parent phone"
              style="height: 33px; border-radius: 8px; font-size: 14px;">
          </div>

          <!-- Level -->
          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Level</label>
            <select name="form_level" class="form-select" required
              style="height: 33px; border-radius: 8px; font-size: 14px;">
              {% for level in data_level %}
              <option value="{{ level[0] }}">{{ level[1] }}</option>
              {% endfor %}
            </select>
          </div>

          <!-- Teacher -->
          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Teacher</label>
            <select name="form_teacher" class="form-select" required
              style="height: 33px; border-radius: 8px; font-size: 14px;">
              <option disabled selected>Select a teacher</option>
              {% for teacher in data_teacher %}
              <option value="{{ teacher[0] }}">{{ teacher[1] }}</option>
              {% endfor %}
            </select>
          </div>

          <!-- Start Date -->
          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Start Date</label>
            <input type="date" name="form_start_date" class="form-control" required
              style="height: 33px; border-radius: 8px; font-size: 14px;">
          </div>

          <!-- Class Day -->
          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Class Day</label>
            <select name="form_class_day" class="form-select" required
              style="height: 33px; border-radius: 8px; font-size: 14px;">
              <option value="" selected disabled>Select day</option>
              <option value="MON">Monday</option>
              <option value="TUE">Tuesday</option>
              <option value="WED">Wednesday</option>
              <option value="THU">Thursday</option>
              <option value="FRI">Friday</option>
              <option value="SAT">Saturday</option>
            </select>
          </div>

          <!-- Start Time & End Time -->
          <!-- <div class="form-group mb-3 row">
            <div class="col-6">
              <label style="font-weight: 500; font-size: 15px;" class="mb-1">Start Time</label>
              <input type="time" name="form_start_time" class="form-control" required
                style="height: 33px; border-radius: 8px; font-size: 14px;">
            </div>
            <div class="col-6">
              <label style="font-weight: 500; font-size: 15px;" class="mb-1">End Time</label>
              <input type="time" name="form_end_time" class="form-control" required
                style="height: 33px; border-radius: 8px; font-size: 14px;">
            </div>
          </div> -->

          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Class Time</label>
            <select name="form_time_slot" class="form-select" required
              style="height: 38px; border-radius: 8px; font-size: 14px;">

              <option value="" selected disabled>Select time slot</option>

              <option value="09:00|10:00">09:00 - 10:00</option>
              <option value="10:00|11:00">10:00 - 11:00</option>
              <option value="11:00|12:00">11:00 - 12:00</option>
              <option value="12:00|13:00">12:00 - 13:00</option>
              <option value="13:00|14:00">13:00 - 14:00</option>
              <option value="14:00|15:00">14:00 - 15:00</option>
              <option value="15:00|16:00">15:00 - 16:00</option>
              <option value="16:00|17:00">16:00 - 17:00</option>

            </select>
          </div>

          <!-- Total Meetings -->
          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Total Meetings</label>
            <input type="number" name="form_total_meetings" id="totalMeetings" class="form-control" required min="1"
              placeholder="Enter number of meetings" style="height: 33px; border-radius: 8px; font-size: 14px;">
          </div>

          <div>
            <input type="submit" value="ADD SCHEDULE" class="btn btn-sm w-100 fw-bold"
              style="border-radius: 5px; background-color: #ff682d; color: white;">
          </div>
        </form>

      </div>
    </div>

  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    $(document).ready(function () {
      $('.select2').select2();
    });
  </script>

  <script>
    const dobInput = document.getElementById("trialDob");
    const ageInput = document.getElementById("trialAge");

    dobInput.addEventListener("change", function () {

      if (!this.value) {
        ageInput.value = "";
        return;
      }

      const dob = new Date(this.value);
      const today = new Date();

      let years = today.getFullYear() - dob.getFullYear();
      let months = today.getMonth() - dob.getMonth();

      if (today.getDate() < dob.getDate()) {
        months--;
      }

      if (months < 0) {
        years--;
        months += 12;
      }

      ageInput.value =
        years + "." + String(months).padStart(2, "0");
    });
  </script>

</body>

</html>
