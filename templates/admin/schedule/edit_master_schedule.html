<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Quicksand:wght@300..700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Lexend -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
  <title>Edit Master Schedule</title>
  <style>
    body {
      overflow-x: hidden;
    }
  </style>
</head>

<body style="font-family: Quicksand;">

  <!-- TOP NAVBAR -->
  {% include 'admin/components/top_navbar.html' %}

  <div class="d-flex">

    <!-- SIDEBAR -->
    {% include 'admin/components/sidebar.html' %}

    <!-- MAIN CONTENT -->
    <div class="flex-grow-1 p-4" style="background-color: #f4f6f9;">
      <div class="d-flex justify-content-center align-items-center">
        <form action="/process_edit_master_schedule" method="POST" class="bg-white p-4 shadow needs-validation"
          style="border-radius: 10px; width: 500px;">
          <input type="hidden" name="form_id_master_schedule" class="form-control" value="{{data_master_schedule[0]}}">
          <h3 class="mb-4 fw-bold">Edit Student Schedule</h3>
          <!-- Term -->
          <!-- Term -->
          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Term</label>
            <select name="form_term" class="form-select" required
              style="height: 33px; border-radius: 8px; font-size: 14px;">

              <option value="1" {% if data_master_schedule[1] | int == 1 %}selected{% endif %}>Term 1</option>
              <option value="2" {% if data_master_schedule[1] | int == 2 %}selected{% endif %}>Term 2</option>
              <option value="3" {% if data_master_schedule[1] | int == 3 %}selected{% endif %}>Term 3</option>
              <option value="4" {% if data_master_schedule[1] | int == 4 %}selected{% endif %}>Term 4</option>

            </select>
          </div>

          <!-- Student -->
          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Student</label>
            <select name="form_student" class="form-select" required
              style="height: 33px; border-radius: 8px; font-size: 14px;">
              {% for student in data_student %}
              <option value="{{ student.id }}" {% if student.id==data_master_schedule[8] %}selected{% endif %}>
                {{ student.name }} ({{ student.age }})</option>
              {% endfor %}
            </select>
          </div>

          <!-- Level -->
          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Level</label>
            <select name="form_level" class="form-select" required
              style="height: 33px; border-radius: 8px; font-size: 14px;">
              {% for level in data_level %}
              <option value="{{ level[0] }}"
                {% if level[0]|string == data_master_schedule[4]|string %}selected{% endif %}>{{ level[1] }}</option>
              {% endfor %}
            </select>
          </div>

          <!-- Teacher -->
          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Teacher</label>
            <select name="form_teacher" class="form-select" required
              style="width: 100%; height: 33px; border-radius: 8px; font-size: 14px;">
              {% for teacher in data_teacher %}
              <option value="{{teacher[0]}}" {% if teacher[0]==data_master_schedule[7] %}selected{% endif %}>
                {{teacher[1]}}</option>
              {% endfor %}
            </select>
          </div>

          <!-- Start Date -->
          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Start Date</label>
            <input type="date" name="form_start_date" class="form-control" required value="{{data_master_schedule[2]}}"
              style="height: 33px; border-radius: 8px; font-size: 14px;">
          </div>

          <!-- Class Day -->
          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Class Day</label>
            <select name="form_class_day" class="form-select" required
              style="height: 33px; border-radius: 8px; font-size: 14px;">
              <option value="MON" {% if data_master_schedule[3] == "MON" %}selected{% endif %}>Monday</option>
              <option value="TUE" {% if data_master_schedule[3] == "TUE" %}selected{% endif %}>Tuesday</option>
              <option value="WED" {% if data_master_schedule[3] == "WED" %}selected{% endif %}>Wednesday</option>
              <option value="THU" {% if data_master_schedule[3] == "THU" %}selected{% endif %}>Thursday</option>
              <option value="FRI" {% if data_master_schedule[3] == "FRI" %}selected{% endif %}>Friday</option>
              <option value="SAT" {% if data_master_schedule[3] == "SAT" %}selected{% endif %}>Saturday</option>
            </select>
          </div>

          <!-- TIME SLOT -->
          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">
              Class Time
            </label>

            <select name="form_time_slot" class="form-select" required
              style="height: 33px; border-radius: 8px; font-size: 14px;">

              <option value="09:00|10:00"
                {% if data_master_schedule[5] == "09:00" and data_master_schedule[6] == "10:00" %}selected{% endif %}>
                09:00 - 10:00
              </option>

              <option value="10:00|11:00"
                {% if data_master_schedule[5] == "10:00" and data_master_schedule[6] == "11:00" %}selected{% endif %}>
                10:00 - 11:00
              </option>

              <option value="11:00|12:00"
                {% if data_master_schedule[5] == "11:00" and data_master_schedule[6] == "12:00" %}selected{% endif %}>
                11:00 - 12:00
              </option>

              <option value="12:00|13:00"
                {% if data_master_schedule[5] == "12:00" and data_master_schedule[6] == "13:00" %}selected{% endif %}>
                12:00 - 13:00
              </option>

              <option value="13:00|14:00"
                {% if data_master_schedule[5] == "13:00" and data_master_schedule[6] == "14:00" %}selected{% endif %}>
                13:00 - 14:00
              </option>

              <option value="14:00|15:00"
                {% if data_master_schedule[5] == "14:00" and data_master_schedule[6] == "15:00" %}selected{% endif %}>
                14:00 - 15:00
              </option>

              <option value="15:00|16:00"
                {% if data_master_schedule[5] == "15:00" and data_master_schedule[6] == "16:00" %}selected{% endif %}>
                15:00 - 16:00
              </option>

              <option value="16:00|17:00"
                {% if data_master_schedule[5] == "16:00" and data_master_schedule[6] == "17:00" %}selected{% endif %}>
                16:00 - 17:00
              </option>

            </select>
          </div>

          <!-- Total Meetings -->
          <div class="form-group mb-3">
            <label style="font-weight: 500; font-size: 15px;" class="mb-1">Total Meetings</label>
            <input type="number" name="form_total_meetings" class="form-control" required min="1"
              value="{{data_master_schedule[9]}}" placeholder="Enter number of meetings"
              style="height: 33px; border-radius: 8px; font-size: 14px;">
          </div>
          <div>
            <input type="submit" value="EDIT STUDENT SCHEDULE" class="btn btn-sm w-100 fw-bold"
              style="border-radius: 5px; background-color: #ffd555;">
          </div>
        </form>
      </div>
    </div>

  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
