<style>
    #sidebar {
        min-height: 100vh;
        transition: width 0.3s;
        border-right: 1px solid #ebebeb;
        width: 200px;
        min-width: 200px;
        flex-shrink: 0;
        background-color: white;
    }

    #sidebar.collapsed {
        width: 80px !important;
        min-width: 80px !important;
    }

    #sidebar .nav-link span {
        transition: opacity 0.3s;
    }

    #sidebar.collapsed .nav-link {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 12px 0;
    }

    #sidebar.collapsed .nav-link span {
        display: none;
    }

    #sidebar.collapsed .nav-link i {
        margin-right: 0 !important;
        font-size: 18px;
    }

    #sidebar.collapsed .nav-item {
        width: 100%;
        display: flex;
        justify-content: center;
    }

    #sidebar .nav-item span {
        font-family: Lexend;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 1.3px;
        text-transform: uppercase;
        color: #4b5563;
        position: relative;
        transition: color 0.3s ease;
    }

    #sidebar .nav-item i {
        color: #e84100;
    }

    #toggle-btn {
        color: #4b5563;
        border: 2px solid #ff946a;
        background-color: #fff2be;
        border-radius: 10px;
    }
</style>

<!-- SIDEBAR -->
<div id="sidebar" class="text-white p-3" style="width: 200px; background-color: white;">

    <button id="toggle-btn" class="btn btn-outline-light w-100 mb-4">

    </button>

    <ul class="nav nav-pills flex-column mb-auto">
        <!-- Dashboard -->
        <li class="nav-item mb-2">
            <a href="/dashboard_director" class="nav-link text-white">

        <!-- Branches -->
        <li class="nav-item mb-2">
            <a href="/branch" class="nav-link text-white">
                <i class="fa-solid fa-school me-2"></i>
                <span>Branches</span>
            </a>
        </li>
        <!-- Admins -->
        <li class="nav-item mb-2">
            <a href="/admin" class="nav-link text-white">
                <i class="fa-solid fa-circle-user me-2"></i>

            </a>
        </li>

        <li class="nav-item mb-2">
            <a href="/director_teacher" class="nav-link text-white">

        </li>
        <!-- Students -->
        <li class="nav-item mb-2">
            <a href="/director_student" class="nav-link text-white">
                <i class="fa-solid fa-users me-2"></i>

        <li class="nav-item mb-2">
            <a href="/director_schedule" class="nav-link text-white">
                <i class="fa-solid fa-calendar-days me-2"></i>
                <span>Schedule</span>
            </a>
        </li>
        <!-- Payment -->
        <li class="nav-item mb-2">
            <a href="/director_payment" class="nav-link text-white">
                <i class="fa-solid fa-money-bill me-2"></i>
                <span>Payment</span>
            </a>
        </li>

    </ul>
</div>

<script>
    const toggleBtn = document.getElementById("toggle-btn");
    const sidebar = document.getElementById("sidebar");

    toggleBtn.addEventListener("click", () => {
        sidebar.classList.toggle("collapsed");
    });
</script>
