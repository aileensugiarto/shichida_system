<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Quicksand:wght@300..700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Lexend -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
  <title>Director Dashboard</title>
  <style>
    body {
      overflow-x: hidden;
    }

    .dashboard-icon-container {
      justify-content: center;
      align-items: center;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 768px) {
      .dashboard-icon-container {
        border-right: 2px solid #dedede;
      }
    }

    .dashboard-icon {
      font-size: 50px;
      padding: 20px 17px;
      border-radius: 20px;
      background: linear-gradient(135deg, #ff682d, #fea101);
      color: white;
      /* box-shadow: 0 10px 22px rgba(255, 104, 45, 0.35); */
    }
  </style>
</head>

<body style="font-family: Quicksand;">

  <!-- TOP NAVBAR -->
  {% include 'director/components/top_navbar.html' %}

  <div class="d-flex">

    <!-- SIDEBAR -->
    {% include 'director/components/sidebar.html' %}

    <!-- MAIN CONTENT -->
    <div class="flex-grow-1 p-4" style="background-color: #f4f6f9;">
      <h2 class="mb-4 fw-bold">Dashboard</h2>

      <div class="row g-3" style="margin-bottom: 50px;">
        <!-- Total Students -->
        <div class="col-md-12 col-lg-4">
          <div class="d-flex flex-column flex-md-row bg-white pt-4 pb-4 shadow-sm" style="border-radius: 20px;">
            <div class="col-12 col-md-5 text-center dashboard-icon-container">
              <i class="fa-solid fa-users fa-2x dashboard-icon"></i>
            </div>
            <div class="col-12 col-md-7 d-flex flex-column justify-content-center py-3">
              <h1 class="fw-bold text-center text-md-start ms-md-4" style="font-size: 40px;">{{total_student}}</h1>
              <h6 class="text-center text-md-start ms-md-4"
                style="font-family: Lexend; text-transform: uppercase; font-size: 14px; font-weight:600; color:#333; letter-spacing: 1.3px;">
                Total Students
              </h6>
            </div>
          </div>
        </div>

        <!-- Total Teachers -->
        <div class="col-md-12 col-lg-4">
          <div class="d-flex flex-column flex-md-row bg-white pt-4 pb-4 shadow-sm" style="border-radius: 20px;">
            <div class="col-12 col-md-5 text-center dashboard-icon-container">
              <i class="fa-solid fa-chalkboard-user fa-2x dashboard-icon"></i>
            </div>
            <div class="col-12 col-md-7 d-flex flex-column justify-content-center py-3">
              <h1 class="fw-bold text-center text-md-start ms-md-4" style="font-size: 40px;">{{ total_teacher }}</h1>
              <h6 class="text-center text-md-start ms-md-4"
                style="font-family: Lexend; text-transform: uppercase; font-size: 14px; font-weight:600; color:#333; letter-spacing: 1.3px;">
                Total Teachers
              </h6>
            </div>
          </div>
        </div>

        <!-- Total Branch -->
        <div class="col-md-12 col-lg-4">
          <div class="d-flex flex-column flex-md-row bg-white pt-4 pb-4 shadow-sm" style="border-radius: 20px;">
            <div class="col-12 col-md-5 text-center dashboard-icon-container">
              <i class="fa-solid fa-school fa-2x dashboard-icon"></i>
            </div>
            <div class="col-12 col-md-7 d-flex flex-column justify-content-center py-3">
              <h1 class="fw-bold text-center text-md-start ms-md-4" style="font-size: 40px;">{{ total_branch }}</h1>
              <h6 class="text-center text-md-start ms-md-4"
                style="font-family: Lexend; text-transform: uppercase; font-size: 14px; font-weight:600; color:#333; letter-spacing: 1.3px;">
                Total Branches
              </h6>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
